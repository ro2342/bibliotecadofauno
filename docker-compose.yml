---
services:
  calibre-web-automated:
    # Build the image from this repo (Biblioteca do Fauno / Bookshelf on top of
    # calibre-web-automated) instead of pulling upstream's published image.
    # First build: `docker compose build` (or `bash build.sh -l -u ro2342 -v dev`).
    build: .
    image: ghcr.io/ro2342/bibliotecadofauno:latest
    container_name: calibre-web-automated
    environment:
      # Only change these if you know what you're doing
      - PUID=1000
      - PGID=1000
      # Edit to match your current timezone https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=${TZ:-UTC}
      # Sets the listening port for the application. Defaults to 8342 here; override CWA_PORT in
      # your local .env (gitignored) to pick a different one, e.g. CWA_PORT=8083 to drop in as a
      # replacement for an existing calibre-web-automated instance.
      - CWA_PORT_OVERRIDE=${CWA_PORT:-8342}
      # Hardcover API Key required for Hardcover as a Metadata Provider, get one here: https://docs.hardcover.app/api/getting-started/
      # Set HARDCOVER_TOKEN in your local .env file - never hardcode a real token here, this file is committed.
      - HARDCOVER_TOKEN=${HARDCOVER_TOKEN:-}
      # Bookshelf: optional, read-only Audiobookshelf integration (github.com/advplyr/audiobookshelf).
      # Set both AUDIOBOOKSHELF_URL and AUDIOBOOKSHELF_TOKEN in your local .env to enable. Leave them
      # unset there and Bookshelf just runs without ABS data - nothing else to configure.
      # Get an API token from ABS under Settings > Users > (your user), or Settings > API Keys.
      - AUDIOBOOKSHELF_URL=${AUDIOBOOKSHELF_URL:-}
      - AUDIOBOOKSHELF_TOKEN=${AUDIOBOOKSHELF_TOKEN:-}
      # If your library is on a network share (e.g., NFS/SMB), disables WAL and chown to reduce locking/permission issues,
      # and switches file watching to polling (more reliable on network mounts) instead of inotify.
      # Accepts: true/false (default: false)
      - NETWORK_SHARE_MODE=false
      # If you want to force polling mode regardless of share type, set CWA_WATCH_MODE=poll
      # - CWA_WATCH_MODE=poll
      # If running behind multiple proxies (e.g., Cloudflare Tunnel + reverse proxy), set the total number of proxies
      # This ensures proper IP detection for session protection and rate limiting (default: 1)
      # - TRUSTED_PROXY_COUNT=2
      # Skip the automatic library detection/mount at startup. When enabled, the auto-library service will not run.
      # Accepts: true/yes/1 to disable auto-mount (default: false)
      # - DISABLE_LIBRARY_AUTOMOUNT=false
    volumes:
      # Real host paths come from your local .env (CWA_CONFIG_DIR / CWA_INGEST_DIR / CWA_LIBRARY_DIR),
      # so this file stays a generic template - no personal server paths committed to the repo.
      #
      # CW/CWA users migrating an existing install: point CWA_CONFIG_DIR at it directly to carry over
      # users/settings (no need for a copy - Bookshelf adds no new tables/migrations of its own, so this
      # is exactly as safe as a normal calibre-web-automated version bump; still, back it up first, see
      # BOOKSHELF.md).
      - ${CWA_CONFIG_DIR:-/path/to/config/folder}:/config
      # This is an ingest dir, NOT a library one. Anything added here will be automatically added to your library according to the settings you have configured in CWA Settings page. All files placed here are REMOVED AFTER PROCESSING
      - ${CWA_INGEST_DIR:-/path/to/the/folder/you/want/to/use/for/book/ingest}:/cwa-book-ingest
      # If you don't have an existing library, CWA will automatically create one at the bind provided here
      - ${CWA_LIBRARY_DIR:-/path/to/your/calibre/library}:/calibre-library
      # If you use calibre plugins, you can bind your plugins folder here to have CWA attempt to add them to it's workflow (WIP)
      # If you are starting with a fresh install, you also need to copy customize.py.json to the Calibre config volume above, in /path/to/config/folder/.config/calibre/customize.py.json, see the README for more info
      # - /path/to/your/calibre/plugins/folder:/config/.config/calibre/plugins
    ports:
      # Same CWA_PORT override as above controls both sides here.
      - "${CWA_PORT:-8342}:${CWA_PORT:-8342}"
    # If you set CWA_PORT_OVERRIDE to a port below 1024, you may need to uncomment the following line:
    # cap_add:
    #   - NET_BIND_SERVICE
    restart: unless-stopped
